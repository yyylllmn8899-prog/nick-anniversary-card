<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nick 入职七周年贺卡</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cormorant+Garamond:ital,wght@1,300;1,600&family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1a14;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Card Shell ─────────────────────────────────── */
    .card {
      width: 800px;
      height: 1100px;
      position: relative;
      overflow: hidden;
      background: #16120D;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: center center;
      flex-shrink: 0;
    }

    /* Warm ambient glow */
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 110% 50% at 50% 0%,    rgba(212,181,88,0.18) 0%, transparent 65%),
        radial-gradient(ellipse 90%  65% at 50% 108%,   rgba(160,95,25,0.18)  0%, transparent 65%),
        radial-gradient(ellipse 55%  35% at 12% 55%,    rgba(212,181,88,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 55%  35% at 88% 55%,    rgba(212,181,88,0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ─── Double Border ───────────────────────────────── */
    .border-outer {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(212,181,88,0.32);
      pointer-events: none;
      z-index: 10;
    }
    .border-inner {
      position: absolute;
      inset: 30px;
      border: 1px solid rgba(212,181,88,0.13);
      pointer-events: none;
      z-index: 10;
    }

    /* Corner ornaments */
    .corner {
      position: absolute;
      width: 28px; height: 28px;
      z-index: 11;
    }
    .c-tl { top: 16px;  left: 16px;  border-top: 2px solid rgba(212,181,88,0.72); border-left:  2px solid rgba(212,181,88,0.72); }
    .c-tr { top: 16px;  right: 16px; border-top: 2px solid rgba(212,181,88,0.72); border-right: 2px solid rgba(212,181,88,0.72); }
    .c-bl { bottom: 16px; left: 16px;  border-bottom: 2px solid rgba(212,181,88,0.72); border-left:  2px solid rgba(212,181,88,0.72); }
    .c-br { bottom: 16px; right: 16px; border-bottom: 2px solid rgba(212,181,88,0.72); border-right: 2px solid rgba(212,181,88,0.72); }

    /* ─── Music Staff (top) ───────────────────────────── */
    .staff-top {
      position: absolute;
      top: 55px; left: 55px; right: 55px;
      pointer-events: none;
    }
    .staff-line {
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(212,181,88,0.28) 15%, rgba(212,181,88,0.28) 85%, transparent 100%);
      margin-bottom: 8px;
    }

    /* ─── Floating Music Notes ────────────────────────── */
    .note {
      position: absolute;
      color: rgba(212,181,88, var(--op, 0.38));
      font-size: var(--sz, 22px);
      animation: floatNote var(--dur, 4s) ease-in-out infinite;
      animation-delay: var(--dl, 0s);
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }
    @keyframes floatNote {
      0%,100% { transform: translateY(0)    rotate(var(--r, -10deg)); }
      50%      { transform: translateY(-10px) rotate(calc(var(--r, -10deg) + 5deg)); }
    }

    /* ─── Header ──────────────────────────────────────── */
    .header {
      position: relative;
      z-index: 2;
      margin-top: 58px;
      text-align: center;
    }
    .header-label {
      font-family: 'Noto Serif SC', serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 7px;
      color: rgba(212,181,88,0.75);
    }
    .header-name {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 38px;
      letter-spacing: 6px;
      color: transparent;
      background: linear-gradient(130deg, #B8921E 0%, #D4B558 30%, #F5DC88 52%, #D4B558 74%, #B8921E 100%);
      -webkit-background-clip: text;
      background-clip: text;
      line-height: 1;
      margin-top: 6px;
    }

    /* ─── Vinyl Record ────────────────────────────────── */
    .record-wrap {
      position: relative;
      z-index: 2;
      margin-top: 36px;
      width: 320px; height: 320px;
    }

    .record {
      width: 320px; height: 320px;
      border-radius: 50%;
      animation: spin 22s linear infinite;
      position: relative;

      background:
        conic-gradient(
          from 0deg,
          rgba(212,181,88,0.00)  0deg,
          rgba(212,181,88,0.08)  3deg,
          rgba(212,181,88,0.00)  6deg,
          rgba(212,181,88,0.05) 12deg,
          rgba(212,181,88,0.00) 18deg,
          rgba(212,181,88,0.10) 24deg,
          rgba(212,181,88,0.00) 32deg,
          rgba(212,181,88,0.06) 40deg,
          rgba(212,181,88,0.00) 50deg,
          rgba(212,181,88,0.09) 58deg,
          rgba(212,181,88,0.00) 68deg,
          rgba(212,181,88,0.05) 78deg,
          rgba(212,181,88,0.00) 90deg,
          rgba(212,181,88,0.11) 100deg,
          rgba(212,181,88,0.00) 112deg,
          rgba(212,181,88,0.07) 124deg,
          rgba(212,181,88,0.00) 138deg,
          rgba(212,181,88,0.09) 150deg,
          rgba(212,181,88,0.00) 165deg,
          rgba(212,181,88,0.05) 180deg,
          rgba(212,181,88,0.00) 196deg,
          rgba(212,181,88,0.10) 210deg,
          rgba(212,181,88,0.00) 226deg,
          rgba(212,181,88,0.08) 240deg,
          rgba(212,181,88,0.00) 256deg,
          rgba(212,181,88,0.06) 272deg,
          rgba(212,181,88,0.00) 290deg,
          rgba(212,181,88,0.11) 306deg,
          rgba(212,181,88,0.00) 324deg,
          rgba(212,181,88,0.05) 342deg,
          rgba(212,181,88,0.00) 360deg
        ),
        repeating-radial-gradient(
          circle at center,
          #221810 0px,
          #2a1e14 3px,
          #1e1610 6px,
          #261a12 9px,
          #221810 12px
        );

      box-shadow:
        0 0 0 3px rgba(212,181,88,0.22),
        0 0 0 5px rgba(212,181,88,0.06),
        0 24px 80px rgba(0,0,0,0.80),
        0  8px 30px rgba(0,0,0,0.55),
        inset 0 0 40px rgba(212,181,88,0.05);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Record Label */
    .record-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 112px; height: 112px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #5a300e, #341a0a, #200e06);
      border: 1.5px solid rgba(212,181,88,0.60);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }
    .record-label::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(212,181,88,0.22);
    }
    .label-num {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 50px;
      line-height: 1;
      color: #D4B558;
      text-shadow: 0 2px 12px rgba(212,181,88,0.55);
    }
    .label-text {
      font-family: 'Noto Serif SC', serif;
      font-size: 8px;
      letter-spacing: 3px;
      color: rgba(212,181,88,0.65);
      margin-top: 3px;
    }

    /* Spindle hole */
    .record-hole {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #16120D;
      box-shadow: 0 0 0 1px rgba(212,181,88,0.42);
      z-index: 4;
    }

    /* ─── Title ───────────────────────────────────────── */
    .title-section {
      position: relative; z-index: 2;
      text-align: center;
      margin-top: 32px;
    }
    .title-main {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: 100px;
      line-height: 1;
      letter-spacing: -4px;
      color: transparent;
      background: linear-gradient(140deg, #B8921E 0%, #D4B558 28%, #F5DC88 50%, #D4B558 72%, #B8921E 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }
    .title-en {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 19px;
      letter-spacing: 5px;
      color: rgba(245,230,195,0.68);
      margin-top: 6px;
    }

    /* ─── Divider ─────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 320px;
      margin: 22px auto;
    }
    .div-line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,181,88,0.58), transparent);
    }
    .div-note {
      font-size: 16px;
      color: rgba(212,181,88,0.80);
    }

    /* ─── Message ─────────────────────────────────────── */
    .message {
      position: relative; z-index: 2;
      text-align: center;
      padding: 0 75px;
    }
    .message p {
      font-family: 'Noto Serif SC', serif;
      font-weight: 300;
      font-size: 21px;
      line-height: 2;
      letter-spacing: 3px;
      color: rgba(245,230,195,0.90);
    }
    .hl { color: #D4B558; font-weight: 700; }

    /* ─── Equalizer ───────────────────────────────────── */
    .equalizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 50px;
      margin: 26px auto 0;
      position: relative; z-index: 2;
    }
    .eq-bar {
      width: 6px;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(to top,
        rgba(212,181,88,0.92) 0%,
        rgba(212,181,88,0.50) 60%,
        rgba(212,181,88,0.12) 100%
      );
      animation: eqBounce var(--d, 0.8s) ease-in-out infinite alternate;
      animation-delay: var(--dl, 0s);
    }
    @keyframes eqBounce {
      from { height: var(--lo, 8px);  }
      to   { height: var(--hi, 38px); }
    }

    /* ─── Staff (bottom) ──────────────────────────────── */
    .staff-bottom {
      position: absolute;
      bottom: 56px; left: 55px; right: 55px;
      z-index: 2;
    }
    .staff-bottom .staff-line {
      margin-bottom: 9px;
      background: linear-gradient(90deg, transparent 0%, rgba(212,181,88,0.20) 15%, rgba(212,181,88,0.20) 85%, transparent 100%);
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 32px;
      left: 0; right: 0;
      text-align: center;
      z-index: 2;
    }
    .footer span {
      font-family: 'Noto Serif SC', serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 5px;
      color: rgba(212,181,88,0.48);
    }

    /* ─── Music Toggle Button ─────────────────────────── */
    #music-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(22, 18, 13, 0.92);
      border: 1.5px solid rgba(212, 181, 88, 0.55);
      color: rgba(212, 181, 88, 0.88);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.45);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    #music-btn:hover {
      background: rgba(212, 181, 88, 0.12);
      border-color: rgba(212, 181, 88, 0.85);
      box-shadow: 0 4px 24px rgba(212, 181, 88, 0.22);
    }
    #music-btn.playing {
      border-color: rgba(212, 181, 88, 0.9);
      animation: btnGlow 2s ease-in-out infinite;
    }
    @keyframes btnGlow {
      0%, 100% { box-shadow: 0 0 0 0   rgba(212,181,88,0.40), 0 4px 20px rgba(0,0,0,0.45); }
      50%       { box-shadow: 0 0 0 10px rgba(212,181,88,0.00), 0 4px 28px rgba(212,181,88,0.28); }
    }
    #music-btn .btn-icon {
      line-height: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

<!-- ─── Card ─────────────────────────────────────────── -->
<div class="card">

  <!-- Borders -->
  <div class="border-outer"></div>
  <div class="border-inner"></div>

  <!-- Equalizer -->
  <div class="equalizer">
    <div class="eq-bar" style="--d:0.60s;--dl:0.00s;--lo:10px;--hi:28px;"></div>
    <div class="eq-bar" style="--d:0.78s;--dl:0.08s;--lo:14px;--hi:44px;"></div>
    <div class="eq-bar" style="--d:0.65s;--dl:0.16s;--lo: 8px;--hi:32px;"></div>
    <div class="eq-bar" style="--d:0.90s;--dl:0.24s;--lo:18px;--hi:50px;"></div>
    <div class="eq-bar" style="--d:0.72s;--dl:0.32s;--lo:12px;--hi:38px;"></div>
    <div class="eq-bar" style="--d:0.84s;--dl:0.40s;--lo:16px;--hi:48px;"></div>
    <div class="eq-bar" style="--d:0.68s;--dl:0.48s;--lo:10px;--hi:34px;"></div>
    <div class="eq-bar" style="--d:0.76s;--dl:0.56s;--lo:20px;--hi:52px;"></div>
    <div class="eq-bar" style="--d:0.62s;--dl:0.64s;--lo: 8px;--hi:26px;"></div>
    <div class="eq-bar" style="--d:0.88s;--dl:0.72s;--lo:14px;--hi:46px;"></div>

    <div class="eq-bar" style="--d:0.66s;--dl:0.20s;--lo: 9px;--hi:30px;"></div>
    <div class="eq-bar" style="--d:0.92s;--dl:0.28s;--lo:15px;--hi:48px;"></div>
    <div class="eq-bar" style="--d:0.74s;--dl:0.36s;--lo:13px;--hi:40px;"></div>
    <div class="eq-bar" style="--d:0.64s;--dl:0.44s;--lo:10px;--hi:29px;"></div>
    <div class="eq-bar" style="--d:0.82s;--dl:0.52s;--lo:19px;--hi:50px;"></div>
  </div>

  <!-- Staff lines (bottom) -->
  <div class="staff-bottom">
    <div class="staff-line"></div>
    <div class="staff-line"></div>
    <div class="staff-line"></div>
    <div class="staff-line"></div>
    <div class="staff-line" style="margin-bottom:0;"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span>入 职 7 周 年 ， 以 乐 为 礼</span>
  </div>

</div>

<!-- ─── Music Toggle Button ───────────────────────────── -->
<button id="music-btn" title="播放 / 暂停背景音乐" onclick="toggleMusic()">
  <span class="btn-icon">♪</span>
</button>

<script>
  /* ═══════════════════════════════════════════════════
     Responsive Scale
  ═══════════════════════════════════════════════════ */
  function scaleCard() {
    const card = document.querySelector('.card');
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.min(vw / 800, vh / 1100);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', scaleCard);
  window.addEventListener('orientationchange', function() {
    setTimeout(scaleCard, 200);
  });
  scaleCard();

  /* ═══════════════════════════════════════════════════
     Background Music — BWV 1007 Cello Suite No.1 Prelude
     Synthesized via Web Audio API (cello-like timbre)
     G Major · 32 bars × 8 sixteenth notes · ♩≈75 BPM
  ═══════════════════════════════════════════════════ */

  var audioCtx    = null;
  var masterGain  = null;
  var reverbInput = null;
  var isPlaying   = false;
  var loopTimer   = null;

  // MIDI note number → frequency in Hz
  function midiToHz(n) { return 440 * Math.pow(2, (n - 69) / 12); }

  // BWV 1007 note sequence — MIDI numbers, 8 sixteenth-notes per bar
  // Ref: G2=43 D3=50 G3=55 B3=59 D4=62  C3=48 E3=52 C4=60 E4=64
  //      F#3=54 A3=57 F#4=66  B2=47 A2=45 F#2=42  E2=40 Eb3=51
  var BWV1007 = [
    // ── Section A · Bars 1-8 · Opening in G major ──────────────
    [43,50,55,59,62,59,55,50], //  1  G major
    [43,52,55,60,64,60,55,52], //  2  C / G
    [50,50,54,57,62,57,54,50], //  3  G / D
    [43,50,55,59,62,59,55,50], //  4  G major
    [43,52,55,60,64,60,55,52], //  5  C / G
    [47,50,55,59,62,59,55,50], //  6  G / B
    [45,52,57,60,64,60,57,52], //  7  Am7
    [42,50,54,57,62,57,54,50], //  8  D7 / F#
    // ── Section B · Bars 9-16 · Harmonic development ───────────
    [43,50,55,59,62,59,55,50], //  9  G major
    [53,50,55,59,62,59,55,50], // 10  G7 / F
    [52,48,55,60,64,60,55,48], // 11  C / E
    [51,48,55,60,63,60,55,48], // 12  Cm / Eb
    [50,50,55,59,62,59,55,50], // 13  G / D
    [50,52,57,60,64,60,57,52], // 14  Am7 / D
    [50,54,57,60,66,60,57,54], // 15  D7
    [43,50,55,59,62,59,55,50], // 16  G major
    // ── Section C · Bars 17-24 · Minor episode ─────────────────
    [40,47,52,55,59,55,52,47], // 17  Em
    [40,45,52,57,61,57,52,45], // 18  A7 / E  (C#4=61)
    [45,52,57,60,64,60,57,52], // 19  Am
    [43,52,57,60,64,60,57,52], // 20  Am / G
    [42,54,57,60,63,60,57,54], // 21  F#dim7  (Eb4=63)
    [47,54,57,63,66,63,57,54], // 22  B7      (D#4=63)
    [40,47,52,55,59,55,52,47], // 23  Em
    [36,48,52,55,60,55,52,48], // 24  C major (C2=36)
    // ── Section D · Bars 25-32 · Return & cadence ──────────────
    [50,50,55,59,62,59,55,50], // 25  G / D
    [50,52,57,60,64,60,57,52], // 26  Am7 / D
    [50,54,57,60,66,60,57,54], // 27  D7
    [43,50,55,59,62,59,55,50], // 28  G major
    [43,52,55,60,64,60,55,52], // 29  C / G
    [50,50,54,57,62,57,54,50], // 30  G / D
    [50,54,57,60,66,60,57,54], // 31  D7
    [43,50,55,59,62,59,55,50], // 32  G major (loop end)
  ];

  var NOTE     = 0.200;                          // 16th-note ≈ ♩=75 BPM
  var LOOP_DUR = BWV1007.length * 8 * NOTE;      // ≈ 51.2 s

  /* ── Audio graph setup ────────────────────────────── */
  function setupAudio() {
    audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.30;
    masterGain.connect(audioCtx.destination);

    // Hall reverb: three parallel comb filters → wet bus
    reverbInput = audioCtx.createGain();
    var wetBus  = audioCtx.createGain();
    wetBus.gain.value = 0.26;
    wetBus.connect(audioCtx.destination);

    [[0.37, 0.43], [0.55, 0.38], [0.73, 0.34]].forEach(function(p) {
      var d = audioCtx.createDelay(2.5);
      var g = audioCtx.createGain();
      var f = audioCtx.createBiquadFilter();
      d.delayTime.value = p[0];
      g.gain.value      = p[1];
      f.type = 'lowpass'; f.frequency.value = 3000;
      reverbInput.connect(d);
      d.connect(f); f.connect(g);
      g.connect(d);       // comb feedback
      g.connect(wetBus);  // wet output
    });
  }

  /* ── Cello note synthesizer ───────────────────────── */
  function playCelloNote(midi, t0, dur, vel) {
    var freq = midiToHz(midi);
    var osc  = audioCtx.createOscillator();
    var osc2 = audioCtx.createOscillator();
    var filt = audioCtx.createBiquadFilter();
    var gn   = audioCtx.createGain();

    // Two detuned sawtooth waves → warm cello body
    osc.type  = 'sawtooth'; osc.frequency.value  = freq;
    osc2.type = 'sawtooth'; osc2.frequency.value = freq * 1.0028;

    // Lowpass — darker for low strings, brighter higher up
    filt.type = 'lowpass';
    filt.frequency.value = Math.min(freq * 5, 3000);
    filt.Q.value = 1.4;

    // Natural vibrato with delayed onset
    var vibLFO = audioCtx.createOscillator();
    var vibAmt = audioCtx.createGain();
    vibLFO.frequency.value = 5.6;
    vibAmt.gain.setValueAtTime(0, t0);
    vibAmt.gain.linearRampToValueAtTime(
      freq * 0.006,
      t0 + Math.min(dur * 0.45, 0.26)
    );
    vibLFO.connect(vibAmt);
    vibAmt.connect(osc.frequency);
    vibAmt.connect(osc2.frequency);

    // ADSR
    var relT = Math.max(t0 + 0.03, t0 + dur - 0.10);
    gn.gain.setValueAtTime(0.001, t0);
    gn.gain.linearRampToValueAtTime(vel,        t0 + 0.024);
    gn.gain.setValueAtTime(vel * 0.74,           relT);
    gn.gain.exponentialRampToValueAtTime(0.001,  t0 + dur);

    osc.connect(filt); osc2.connect(filt);
    filt.connect(gn);
    gn.connect(masterGain);
    gn.connect(reverbInput);

    var stop = t0 + dur + 0.08;
    [osc, osc2, vibLFO].forEach(function(o) { o.start(t0); o.stop(stop); });
  }

  /* ── Scheduling ───────────────────────────────────── */
  function scheduleLoop() {
    if (!isPlaying) return;
    var t = audioCtx.currentTime + 0.05;
    BWV1007.forEach(function(bar) {
      bar.forEach(function(midi) {
        playCelloNote(midi, t, NOTE * 1.04, 0.52);
        t += NOTE;
      });
    });
    loopTimer = setTimeout(scheduleLoop, (LOOP_DUR - 0.6) * 1000);
  }

  function startMusic() {
    if (!audioCtx) setupAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    isPlaying = true;
    scheduleLoop();
  }

  function stopMusic() {
    isPlaying = false;
    if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
    if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
  }

  function toggleMusic() {
    var btn  = document.getElementById('music-btn');
    var icon = btn.querySelector('.btn-icon');
    if (isPlaying) {
      stopMusic();
      icon.textContent = '♪';
      btn.classList.remove('playing');
    } else {
      startMusic();
      icon.textContent = '♫';
      btn.classList.add('playing');
    }
  }
</script>
</body>
</html>
