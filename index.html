<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nick 入职七周年贺卡</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cormorant+Garamond:ital,wght@1,300;1,600&family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1a14;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Card Shell ─────────────────────────────────── */
    .card {
      width: 800px;
      height: 1100px;
      position: relative;
      overflow: hidden;
      background: #16120D;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: center center;
      flex-shrink: 0;
    }

    /* Warm ambient glow */
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 110% 50% at 50% 0%,    rgba(212,181,88,0.18) 0%, transparent 65%),
        radial-gradient(ellipse 90%  65% at 50% 108%,   rgba(160,95,25,0.18)  0%, transparent 65%),
        radial-gradient(ellipse 55%  35% at 12% 55%,    rgba(212,181,88,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 55%  35% at 88% 55%,    rgba(212,181,88,0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ─── Double Border ───────────────────────────────── */
    .border-outer {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(212,181,88,0.32);
      pointer-events: none;
      z-index: 10;
    }
    .border-inner {
      position: absolute;
      inset: 30px;
      border: 1px solid rgba(212,181,88,0.13);
      pointer-events: none;
      z-index: 10;
    }

    /* Corner ornaments */
    .corner {
      position: absolute;
      width: 28px; height: 28px;
      z-index: 11;
    }
    .c-tl { top: 16px;  left: 16px;  border-top: 2px solid rgba(212,181,88,0.72); border-left:  2px solid rgba(212,181,88,0.72); }
    .c-tr { top: 16px;  right: 16px; border-top: 2px solid rgba(212,181,88,0.72); border-right: 2px solid rgba(212,181,88,0.72); }
    .c-bl { bottom: 16px; left: 16px;  border-bottom: 2px solid rgba(212,181,88,0.72); border-left:  2px solid rgba(212,181,88,0.72); }
    .c-br { bottom: 16px; right: 16px; border-bottom: 2px solid rgba(212,181,88,0.72); border-right: 2px solid rgba(212,181,88,0.72); }

    /* ─── Music Staff (top) ───────────────────────────── */
    .staff-top {
      position: absolute;
      top: 55px; left: 55px; right: 55px;
      pointer-events: none;
    }
    .staff-line {
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(212,181,88,0.28) 15%, rgba(212,181,88,0.28) 85%, transparent 100%);
      margin-bottom: 8px;
    }

    /* ─── Floating Music Notes ────────────────────────── */
    .note {
      position: absolute;
      color: rgba(212,181,88, var(--op, 0.38));
      font-size: var(--sz, 22px);
      animation: floatNote var(--dur, 4s) ease-in-out infinite;
      animation-delay: var(--dl, 0s);
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }
    @keyframes floatNote {
      0%,100% { transform: translateY(0)    rotate(var(--r, -10deg)); }
      50%      { transform: translateY(-10px) rotate(calc(var(--r, -10deg) + 5deg)); }
    }

    /* ─── Header ──────────────────────────────────────── */
    .header {
      position: relative;
      z-index: 2;
      margin-top: 58px;
      text-align: center;
    }
    .header-label {
      font-family: 'Noto Serif SC', serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 7px;
      color: rgba(212,181,88,0.75);
    }
    .header-name {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 38px;
      letter-spacing: 6px;
      color: transparent;
      background: linear-gradient(130deg, #B8921E 0%, #D4B558 30%, #F5DC88 52%, #D4B558 74%, #B8921E 100%);
      -webkit-background-clip: text;
      background-clip: text;
      line-height: 1;
      margin-top: 6px;
    }

    /* ─── Vinyl Record ────────────────────────────────── */
    .record-wrap {
      position: relative;
      z-index: 2;
      margin-top: 36px;
      width: 320px; height: 320px;
    }

    .record {
      width: 320px; height: 320px;
      border-radius: 50%;
      animation: spin 22s linear infinite;
      position: relative;

      background:
        conic-gradient(
          from 0deg,
          rgba(212,181,88,0.00)  0deg,
          rgba(212,181,88,0.08)  3deg,
          rgba(212,181,88,0.00)  6deg,
          rgba(212,181,88,0.05) 12deg,
          rgba(212,181,88,0.00) 18deg,
          rgba(212,181,88,0.10) 24deg,
          rgba(212,181,88,0.00) 32deg,
          rgba(212,181,88,0.06) 40deg,
          rgba(212,181,88,0.00) 50deg,
          rgba(212,181,88,0.09) 58deg,
          rgba(212,181,88,0.00) 68deg,
          rgba(212,181,88,0.05) 78deg,
          rgba(212,181,88,0.00) 90deg,
          rgba(212,181,88,0.11) 100deg,
          rgba(212,181,88,0.00) 112deg,
          rgba(212,181,88,0.07) 124deg,
          rgba(212,181,88,0.00) 138deg,
          rgba(212,181,88,0.09) 150deg,
          rgba(212,181,88,0.00) 165deg,
          rgba(212,181,88,0.05) 180deg,
          rgba(212,181,88,0.00) 196deg,
          rgba(212,181,88,0.10) 210deg,
          rgba(212,181,88,0.00) 226deg,
          rgba(212,181,88,0.08) 240deg,
          rgba(212,181,88,0.00) 256deg,
          rgba(212,181,88,0.06) 272deg,
          rgba(212,181,88,0.00) 290deg,
          rgba(212,181,88,0.11) 306deg,
          rgba(212,181,88,0.00) 324deg,
          rgba(212,181,88,0.05) 342deg,
          rgba(212,181,88,0.00) 360deg
        ),
        repeating-radial-gradient(
          circle at center,
          #221810 0px,
          #2a1e14 3px,
          #1e1610 6px,
          #261a12 9px,
          #221810 12px
        );

      box-shadow:
        0 0 0 3px rgba(212,181,88,0.22),
        0 0 0 5px rgba(212,181,88,0.06),
        0 24px 80px rgba(0,0,0,0.80),
        0  8px 30px rgba(0,0,0,0.55),
        inset 0 0 40px rgba(212,181,88,0.05);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Record Label */
    .record-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 112px; height: 112px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #5a300e, #341a0a, #200e06);
      border: 1.5px solid rgba(212,181,88,0.60);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }
    .record-label::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(212,181,88,0.22);
    }
    .label-num {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 50px;
      line-height: 1;
      color: #D4B558;
      text-shadow: 0 2px 12px rgba(212,181,88,0.55);
    }
    .label-text {
      font-family: 'Noto Serif SC', serif;
      font-size: 8px;
      letter-spacing: 3px;
      color: rgba(212,181,88,0.65);
      margin-top: 3px;
    }

    /* Spindle hole */
    .record-hole {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #16120D;
      box-shadow: 0 0 0 1px rgba(212,181,88,0.42);
      z-index: 4;
    }

    /* ─── Title ───────────────────────────────────────── */
    .title-section {
      position: relative; z-index: 2;
      text-align: center;
      margin-top: 32px;
    }
    .title-main {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: 100px;
      line-height: 1;
      letter-spacing: -4px;
      color: transparent;
      background: linear-gradient(140deg, #B8921E 0%, #D4B558 28%, #F5DC88 50%, #D4B558 72%, #B8921E 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }
    .title-en {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 19px;
      letter-spacing: 5px;
      color: rgba(245,230,195,0.68);
      margin-top: 6px;
    }

    /* ─── Divider ─────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 320px;
      margin: 22px auto;
    }
    .div-line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,181,88,0.58), transparent);
    }
    .div-note {
      font-size: 16px;
      color: rgba(212,181,88,0.80);
    }

    /* ─── Message ─────────────────────────────────────── */
    .message {
      position: relative; z-index: 2;
      text-align: center;
      padding: 0 75px;
    }
    .message p {
      font-family: 'Noto Serif SC', serif;
      font-weight: 300;
      font-size: 21px;
      line-height: 2;
      letter-spacing: 3px;
      color: rgba(245,230,195,0.90);
    }
    .hl { color: #D4B558; font-weight: 700; }

    /* ─── Equalizer ───────────────────────────────────── */
    .equalizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 5px;
      height: 50px;
      margin: 26px auto 0;
      position: relative; z-index: 2;
    }
    .eq-bar {
      width: 6px;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(to top,
        rgba(212,181,88,0.92) 0%,
        rgba(212,181,88,0.50) 60%,
        rgba(212,181,88,0.12) 100%
      );
      animation: eqBounce var(--d, 0.8s) ease-in-out infinite alternate;
      animation-delay: var(--dl, 0s);
    }
    @keyframes eqBounce {
      from { height: var(--lo, 8px);  }
      to   { height: var(--hi, 38px); }
    }

    /* ─── Staff (bottom) ──────────────────────────────── */
    .staff-bottom {
      position: absolute;
      bottom: 56px; left: 55px; right: 55px;
      z-index: 2;
    }
    .staff-bottom .staff-line {
      margin-bottom: 9px;
      background: linear-gradient(90deg, transparent 0%, rgba(212,181,88,0.20) 15%, rgba(212,181,88,0.20) 85%, transparent 100%);
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 32px;
      left: 0; right: 0;
      text-align: center;
      z-index: 2;
    }
    .footer span {
      font-family: 'Noto Serif SC', serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 5px;
      color: rgba(212,181,88,0.48);
    }

    /* ─── Music Toggle Button ─────────────────────────── */
    #music-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(22, 18, 13, 0.92);
      border: 1.5px solid rgba(212, 181, 88, 0.55);
      color: rgba(212, 181, 88, 0.88);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.45);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    #music-btn:hover {
      background: rgba(212, 181, 88, 0.12);
      border-color: rgba(212, 181, 88, 0.85);
      box-shadow: 0 4px 24px rgba(212, 181, 88, 0.22);
    }
    #music-btn.playing {
      border-color: rgba(212, 181, 88, 0.9);
      animation: btnGlow 2s ease-in-out infinite;
    }
    @keyframes btnGlow {
      0%, 100% { box-shadow: 0 0 0 0   rgba(212,181,88,0.40), 0 4px 20px rgba(0,0,0,0.45); }
      50%       { box-shadow: 0 0 0 10px rgba(212,181,88,0.00), 0 4px 28px rgba(212,181,88,0.28); }
    }
    #music-btn .btn-icon {
      line-height: 1;
      pointer-events: none;
    }

    /* ─── Splash Screen ──────────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      background: #16120D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .splash-border {
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(212,181,88,0.28);
      pointer-events: none;
    }
    .splash-corner {
      position: absolute;
      width: 32px; height: 32px;
    }
    .splash-corner.tl { top: 20px;    left: 20px;  border-top: 2px solid rgba(212,181,88,0.72); border-left:   2px solid rgba(212,181,88,0.72); }
    .splash-corner.tr { top: 20px;    right: 20px; border-top: 2px solid rgba(212,181,88,0.72); border-right:  2px solid rgba(212,181,88,0.72); }
    .splash-corner.bl { bottom: 20px; left: 20px;  border-bottom: 2px solid rgba(212,181,88,0.72); border-left:  2px solid rgba(212,181,88,0.72); }
    .splash-corner.br { bottom: 20px; right: 20px; border-bottom: 2px solid rgba(212,181,88,0.72); border-right: 2px solid rgba(212,181,88,0.72); }
    .splash-label {
      font-family: 'Noto Serif SC', serif;
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 8px;
      color: rgba(212,181,88,0.65);
      margin-bottom: 18px;
    }
    .splash-name {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 72px;
      letter-spacing: 8px;
      color: transparent;
      background: linear-gradient(130deg, #B8921E 0%, #D4B558 30%, #F5DC88 52%, #D4B558 74%, #B8921E 100%);
      -webkit-background-clip: text;
      background-clip: text;
      line-height: 1;
    }
    .splash-sub {
      font-family: 'Noto Serif SC', serif;
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 5px;
      color: rgba(245,230,195,0.50);
      margin-top: 12px;
    }
    .splash-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 240px;
      margin: 30px auto;
    }
    .splash-divider .sdiv-line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,181,88,0.45), transparent);
    }
    .splash-divider .sdiv-note {
      font-size: 16px;
      color: rgba(212,181,88,0.70);
    }
    .splash-enter {
      font-family: 'Noto Serif SC', serif;
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 6px;
      color: rgba(212,181,88,0.85);
      animation: splashPulse 2s ease-in-out infinite;
    }
    @keyframes splashPulse {
      0%,100% { opacity: 0.45; }
      50%      { opacity: 1.00; }
    }
  </style>
</head>
<body>

<!-- ─── Splash Screen ───────────────────────────────── -->
<div id="splash" onclick="enterCard()">
  <div class="splash-border"></div>
  <div class="splash-corner tl"></div>
  <div class="splash-corner tr"></div>
  <div class="splash-corner bl"></div>
  <div class="splash-corner br"></div>
  <div class="splash-label">恭 贺 · 入 职 七 周 年</div>
  <div class="splash-name">Nick</div>
  <div class="splash-sub">Nick's 7th Work Anniversary</div>
  <div class="splash-divider">
    <div class="sdiv-line"></div>
    <div class="sdiv-note">♪</div>
    <div class="sdiv-line"></div>
  </div>
  <div class="splash-enter">点 击 进 入</div>
</div>

<!-- ─── Card ─────────────────────────────────────────── -->
<div class="card">

  <!-- Borders -->
  <div class="border-outer"></div>
  <div class="border-inner"></div>
  <div class="corner c-tl"></div>
  <div class="corner c-tr"></div>
  <div class="corner c-bl"></div>
  <div class="corner c-br"></div>

  <!-- Staff lines (top) -->
  <div class="staff-top">
    <div class="staff-line"></div>
    <div class="staff-line"></div>
    <div class="staff-line"></div>
    <div class="staff-line"></div>
    <div class="staff-line"></div>
  </div>

  <!-- Floating music notes -->
  <span class="note" style="top:86px; left:72px;  --sz:26px; --op:0.38; --dur:5.2s; --dl:0s;   --r:-14deg;">♩</span>
  <span class="note" style="top:68px; left:188px; --sz:18px; --op:0.30; --dur:4.0s; --dl:0.6s; --r:8deg;">♪</span>
  <span class="note" style="top:92px; right:78px; --sz:24px; --op:0.34; --dur:6.1s; --dl:1.1s; --r:-6deg;">♫</span>
  <span class="note" style="top:72px; right:192px;--sz:20px; --op:0.28; --dur:3.8s; --dl:1.7s; --r:11deg;">♬</span>
  <span class="note" style="top:505px;left:56px;  --sz:18px; --op:0.20; --dur:4.6s; --dl:0.9s; --r:-9deg;">♩</span>
  <span class="note" style="top:495px;right:50px; --sz:16px; --op:0.17; --dur:5.4s; --dl:1.3s; --r:10deg;">♪</span>

  <!-- Header -->
  <div class="header">
    <div class="header-label">恭 贺 · 入 职 七 周 年</div>
    <div class="header-name">Nick</div>
  </div>

  <!-- Vinyl record -->
  <div class="record-wrap">
    <div class="record">
      <div class="record-label">
        <div class="label-num">7</div>
        <div class="label-text">ANNIVERSARY</div>
      </div>
      <div class="record-hole"></div>

  <!-- Title -->
  <div class="title-section">
    <div class="title-main">七年</div>

  <!-- Divider -->

    <div class="div-line"></div>

    <div class="div-line"></div>

  <!-- Message -->
  <div class="message">
    <p>
      <span class="hl">Nick</span>，感谢您入职七年来的<span class="hl">坚守与引领</span><br>

      与公司同行的每一天<br>
      都是一首值得珍藏的<span class="hl">乐章</span>
    </p>
  </div>

  <!-- Equalizer -->
  <div class="equalizer">
    <div class="eq-bar" style="--d:0.60s;--dl:0.00s;--lo:10px;--hi:28px;"></div>
    <div class="eq-bar" style="--d:0.78s;--dl:0.08s;--lo:14px;--hi:44px;"></div>
    <div class="eq-bar" style="--d:0.65s;--dl:0.16s;--lo: 8px;--hi:32px;"></div>
    <div class="eq-bar" style="--d:0.90s;--dl:0.24s;--lo:18px;--hi:50px;"></div>
    <div class="eq-bar" style="--d:0.72s;--dl:0.32s;--lo:12px;--hi:38px;"></div>
    <div class="eq-bar" style="--d:0.84s;--dl:0.40s;--lo:16px;--hi:48px;"></div>
    <div class="eq-bar" style="--d:0.68s;--dl:0.48s;--lo:10px;--hi:34px;"></div>
    <div class="eq-bar" style="--d:0.76s;--dl:0.56s;--lo:20px;--hi:52px;"></div>
    <div class="eq-bar" style="--d:0.62s;--dl:0.64s;--lo: 8px;--hi:26px;"></div>
    <div class="eq-bar" style="--d:0.88s;--dl:0.72s;--lo:14px;--hi:46px;"></div>
    <div class="eq-bar" style="--d:0.70s;--dl:0.80s;--lo:11px;--hi:36px;"></div>
    <div class="eq-bar" style="--d:0.80s;--dl:0.12s;--lo:17px;--hi:42px;"></div>
    <div class="eq-bar" style="--d:0.66s;--dl:0.20s;--lo: 9px;--hi:30px;"></div>
    <div class="eq-bar" style="--d:0.92s;--dl:0.28s;--lo:15px;--hi:48px;"></div>
    <div class="eq-bar" style="--d:0.74s;--dl:0.36s;--lo:13px;--hi:40px;"></div>
    <div class="eq-bar" style="--d:0.64s;--dl:0.44s;--lo:10px;--hi:29px;"></div>
    <div class="eq-bar" style="--d:0.82s;--dl:0.52s;--lo:19px;--hi:50px;"></div>
  </div>

  <!-- Staff lines (bottom) -->
  <div class="staff-bottom">
    <div class="staff-line"></div>
    <div class="staff-line"></div>

    <div class="staff-line" style="margin-bottom:0;"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span>入 职 7 周 年 ， 以 乐 为 礼</span>
  </div>

</div>

<!-- ─── Music Toggle Button ───────────────────────────── -->
<button id="music-btn" title="播放 / 暂停背景音乐" onclick="toggleMusic()">
  <span class="btn-icon">♪</span>
</button>

<script>
  /* ═══════════════════════════════════════════════════
     Responsive Scale
  ═══════════════════════════════════════════════════ */
  function scaleCard() {
    const card = document.querySelector('.card');
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.min(vw / 800, vh / 1100);
    card.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', scaleCard);
  window.addEventListener('orientationchange', function() {
    setTimeout(scaleCard, 200);
  });
  scaleCard();

  /* ═══════════════════════════════════════════════════
     Web Audio Synthesizer
     Shostakovich - Suite for Variety Orchestra: Waltz No.2
     Synthesized main theme via Web Audio API
  ═══════════════════════════════════════════════════ */

  var audioCtx = null;
  var masterGain = null;
  var isPlaying = false;
  var loopTimer = null;
  var allNodes = [];

  /* ── Note Frequencies ─────────────────────────────── */
  var F = {
    'B2':123.47, 'C3':130.81, 'D3':146.83, 'Eb3':155.56, 'E3':164.81,
    'F3':174.61, 'G3':196.00, 'Ab3':207.65, 'A3':220.00, 'Bb3':233.08, 'B3':246.94,
    'C4':261.63, 'D4':293.66, 'Eb4':311.13, 'E4':329.63, 'F4':349.23,
    'G4':392.00, 'Ab4':415.30, 'A4':440.00, 'Bb4':466.16, 'B4':493.88,
    'C5':523.25, 'D5':587.33, 'Eb5':622.25, 'F5':698.46, 'G5':783.99
  };

  var BPM = 112;
  var BEAT = 60 / BPM;

  /* ── Melody: Waltz No.2 Main Theme (Cm) ───────────
     [note, duration_in_beats]
     Phrase A (8 bars) → Phrase B (8 bars) → Bridge (8 bars)
  ──────────────────────────────────────────────────── */
  var MELODY = [
    /* Phrase A – descending, lyrical */
    ['G4',3],                              /* bar 1  */
    ['G4',2], ['Ab4',1],                   /* bar 2  */
    ['G4',1], ['F4',1], ['Eb4',1],         /* bar 3  */
    ['D4',3],                              /* bar 4  */
    ['Eb4',3],                             /* bar 5  */
    ['Eb4',2], ['F4',1],                   /* bar 6  */
    ['Eb4',1], ['D4',1], ['C4',1],         /* bar 7  */
    ['B3',3],                              /* bar 8  */

    /* Phrase B – ascending, expansive */
    ['C5',3],                              /* bar 9  */
    ['C5',2], ['D5',1],                    /* bar 10 */
    ['C5',1], ['Bb4',1], ['Ab4',1],        /* bar 11 */
    ['G4',3],                              /* bar 12 */
    ['Ab4',3],                             /* bar 13 */
    ['Ab4',2], ['Bb4',1],                  /* bar 14 */
    ['Ab4',1], ['G4',1], ['F4',1],         /* bar 15 */
    ['Eb4',3],                             /* bar 16 */

    /* Bridge – gentle resolution */
    ['F4',3],                              /* bar 17 */
    ['F4',2], ['G4',1],                    /* bar 18 */
    ['Ab4',2], ['G4',1],                   /* bar 19 */
    ['F4',1], ['Eb4',1], ['D4',1],         /* bar 20 */
    ['Eb4',3],                             /* bar 21 */
    ['D4',2], ['Eb4',1],                   /* bar 22 */
    ['F4',2], ['D4',1],                    /* bar 23 */
    ['C4',3]                               /* bar 24 */
  ];

  /* ── Bass & Chord: waltz oom-pah-pah ──────────────
     [bass_note, chord_note1, chord_note2] per bar
  ──────────────────────────────────────────────────── */
  var CHORDS = [
    /* Phrase A */
    ['C3','Eb4','G4'],   ['C3','Eb4','G4'],    /* Cm         */
    ['C3','Eb4','G4'],   ['G3','B3','D4'],      /* Cm → G     */
    ['C3','Eb4','G4'],   ['C3','Eb4','G4'],     /* Cm         */
    ['G3','B3','D4'],    ['G3','B3','D4'],       /* G          */
    /* Phrase B */
    ['Ab3','C4','Eb4'],  ['Ab3','C4','Eb4'],    /* Ab         */
    ['Eb3','G3','Bb3'],  ['C3','Eb4','G4'],     /* Eb → Cm    */
    ['F3','Ab3','C4'],   ['F3','Ab3','C4'],     /* Fm         */
    ['G3','B3','D4'],    ['C3','Eb4','G4'],     /* G → Cm     */
    /* Bridge */
    ['F3','Ab3','C4'],   ['F3','Ab3','C4'],     /* Fm         */
    ['Ab3','C4','Eb4'],  ['G3','B3','D4'],      /* Ab → G     */
    ['C3','Eb4','G4'],   ['G3','B3','D4'],      /* Cm → G     */
    ['F3','Ab3','C4'],   ['C3','Eb4','G4']      /* Fm → Cm    */
  ];

  /* ── Audio Init ────────────────────────────────────── */
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    /* Master gain */
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.55;

    /* Simple reverb via delay feedback */
    var delay = audioCtx.createDelay();
    delay.delayTime.value = 0.12;
    var feedback = audioCtx.createGain();
    feedback.gain.value = 0.18;
    var reverbGain = audioCtx.createGain();
    reverbGain.gain.value = 0.25;

    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(reverbGain);
    reverbGain.connect(audioCtx.destination);

    masterGain.connect(audioCtx.destination);
    masterGain.connect(delay);
  }

  /* ── Play a single note ────────────────────────────── */
  function playNote(freq, start, dur, opts) {
    opts = opts || {};
    var type = opts.type || 'triangle';
    var vol = opts.vol || 0.22;
    var detune = opts.detune || 0;
    var attack = opts.attack || 0.06;
    var release = Math.min(opts.release || 0.15, dur * 0.4);

    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = detune;

    var t = start;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + attack);
    gain.gain.setValueAtTime(vol, t + dur - release);
    gain.gain.linearRampToValueAtTime(0, t + dur);

    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(t);
    osc.stop(t + dur + 0.02);

    allNodes.push(osc, gain);
    return osc;
  }

  /* ── Schedule one full loop ────────────────────────── */
  function scheduleLoop() {
    if (!audioCtx || !isPlaying) return;
    var t0 = audioCtx.currentTime + 0.05;

    /* ── Melody ─────────────────────────────────────── */
    var mt = t0;
    for (var i = 0; i < MELODY.length; i++) {
      var note = MELODY[i][0];
      var beats = MELODY[i][1];
      var dur = beats * BEAT;

      if (note && F[note]) {
        /* Main voice: triangle */
        playNote(F[note], mt, dur * 0.92, {
          type: 'triangle', vol: 0.20, attack: 0.05, release: 0.12
        });
        /* Warmth layer: sine, slightly detuned */
        playNote(F[note], mt, dur * 0.92, {
          type: 'sine', vol: 0.10, detune: 4, attack: 0.08, release: 0.15
        });
        /* Octave shimmer (very soft) */
        playNote(F[note] * 2, mt, dur * 0.85, {
          type: 'sine', vol: 0.03, detune: -3, attack: 0.12, release: 0.18
        });
      }
      mt += dur;
    }
    var loopDuration = mt - t0;

    /* ── Bass & Chords (waltz oom-pah-pah) ──────────── */
    var bt = t0;
    for (var b = 0; b < CHORDS.length; b++) {
      var ch = CHORDS[b];
      var barDur = 3 * BEAT;

      /* Beat 1: bass root (low, strong) */
      if (F[ch[0]]) {
        playNote(F[ch[0]], bt, BEAT * 0.85, {
          type: 'sine', vol: 0.16, attack: 0.02, release: 0.08
        });
        /* Sub-octave for warmth */
        playNote(F[ch[0]] * 0.5, bt, BEAT * 0.7, {
          type: 'sine', vol: 0.08, attack: 0.03, release: 0.1
        });
      }

      /* Beat 2 & 3: chord (lighter) */
      for (var c = 1; c <= 2; c++) {
        var chordTime = bt + c * BEAT;
        if (F[ch[1]]) {
          playNote(F[ch[1]], chordTime, BEAT * 0.55, {
            type: 'triangle', vol: 0.05, attack: 0.02, release: 0.06
          });
        }
        if (F[ch[2]]) {
          playNote(F[ch[2]], chordTime, BEAT * 0.55, {
            type: 'triangle', vol: 0.05, attack: 0.02, release: 0.06
          });
        }
      }

      bt += barDur;
    }

    /* ── Pad: sustained string-like chords ──────────── */
    bt = t0;
    for (var p = 0; p < CHORDS.length; p += 2) {
      var ch1 = CHORDS[p];
      var padDur = 6 * BEAT; /* 2 bars per pad change */
      for (var n = 0; n < 3; n++) {
        if (F[ch1[n]]) {
          var freq = n === 0 ? F[ch1[n]] * 2 : F[ch1[n]];
          playNote(freq, bt, padDur * 0.9, {
            type: 'sine', vol: 0.025, attack: 0.4, release: 0.5
          });
        }
      }
      bt += padDur;
    }

    /* Schedule next loop */
    var nextLoopMs = (loopDuration - 0.3) * 1000;
    loopTimer = setTimeout(function() {
      scheduleLoop();
    }, nextLoopMs);
  }

  /* ── Cleanup audio nodes to prevent memory leak ───── */
  function cleanupNodes() {
    for (var i = 0; i < allNodes.length; i++) {
      try { allNodes[i].disconnect(); } catch(e) {}
    }
    allNodes = [];
  }

  /* ── Start / Stop / Toggle ─────────────────────────── */
  function startMusic() {
    initAudio();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    isPlaying = true;
    cleanupNodes();
    scheduleLoop();
  }

  function stopMusic() {
    isPlaying = false;
    if (loopTimer) {
      clearTimeout(loopTimer);
      loopTimer = null;
    }
    if (audioCtx) {
      audioCtx.suspend();
    }
    cleanupNodes();
  }

  function updateBtn(playing) {
    var btn  = document.getElementById('music-btn');
    var icon = btn.querySelector('.btn-icon');
    if (playing) {
      icon.textContent = '♫';
      btn.classList.add('playing');
    } else {
      icon.textContent = '♪';
      btn.classList.remove('playing');
    }
  }

  function toggleMusic() {
    if (isPlaying) {
      stopMusic();
      updateBtn(false);
    } else {
      startMusic();
      updateBtn(true);
    }
  }

  function enterCard() {
    var splash = document.getElementById('splash');
    splash.classList.add('fade-out');
    setTimeout(function() { splash.style.display = 'none'; }, 800);
    startMusic();
    updateBtn(true);
  }
</script>
</body>
</html>
